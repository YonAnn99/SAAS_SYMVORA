<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — SYMVORA</title>
    <!--
      Pantalla que el service worker sirve cuando una navegación no llega al
      servidor. NO es modo sin conexión: el modo sin conexión se retiró del
      producto el 2026-09-20 y SYMVORA necesita internet para funcionar.

      Existe porque quien abre la app instalada sin datos no tiene barra de
      direcciones ni botón de recargar: sin esta página vería el error del
      navegador dentro de una ventana muda. Todo va embebido (sin CSS ni JS
      externos) porque por definición aquí no hay red para pedir nada.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0a0a;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .caja { max-width: 22rem; }
      .marca {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #a3a3a3;
        margin: 0 0 1.5rem;
      }
      h1 { font-size: 1.375rem; line-height: 1.3; margin: 0 0 0.75rem; }
      p { color: #a3a3a3; line-height: 1.6; margin: 0 0 1.75rem; font-size: 0.9375rem; }
      button {
        width: 100%;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #0a0a0a;
        background: #fafafa;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="caja">
      <p class="marca">SYMVORA</p>
      <h1>Necesitas conexión a internet</h1>
      <p>
        No pudimos conectar con SYMVORA. Revisa tu WiFi o tus datos móviles y
        vuelve a intentarlo.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
